run:
  timeout: 5m
  go: '1.23'

linters:
  enable:
    - errcheck      # Check for unchecked errors
    - gosimple      # Simplify code
    - govet         # Vet examines Go source code
    - ineffassign   # Detect ineffectual assignments
    - staticcheck   # Go static analysis
    - unused        # Check for unused code
    - gofmt         # Check formatting
    - goimports     # Check imports
    - misspell      # Check spelling
    - revive        # Linting framework
    - gosec         # Security checks
    - bodyclose     # Check HTTP body close
    - noctx         # Find HTTP requests without context
    - sqlclosecheck # Check SQL rows/stmt closed
    - rowserrcheck  # Check SQL rows error
    - exportloopref # Check loop variable references
    - gocritic      # Meta-linter
    - gocyclo       # Cyclomatic complexity

linters-settings:
  gocyclo:
    min-complexity: 15
  
  govet:
    check-shadowing: true
  
  revive:
    rules:
      - name: var-naming
        severity: warning
      - name: package-comments
        severity: warning
      - name: exported
        severity: warning
      - name: indent-error-flow
        severity: warning
      - name: unused-parameter
        severity: warning
  
  gosec:
    excludes:
      - G204 # Subprocess with variable
      - G304 # File path from variable
  
  errcheck:
    check-type-assertions: true
    check-blank: true

issues:
  exclude-rules:
    # Exclude test files from certain checks
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - gosec
    
    # Exclude generated files
    - path: mock_.*\.go
      linters:
        - all
    
    # Allow embed in main
    - linters:
        - unused
      source: "^//go:embed"

  max-issues-per-linter: 0
  max-same-issues: 0

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true

