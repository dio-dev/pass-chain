<svg width="400" height="100" viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d946ef;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d946ef;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shield Icon -->
  <g transform="translate(10, 10)">
    <path d="M 40 10 L 65 20 L 65 50 Q 65 65 40 75 Q 15 65 15 50 L 15 20 Z" 
          fill="url(#iconGradient)" 
          stroke="#a855f7" 
          stroke-width="2"
          filter="url(#glow)"/>
    
    <!-- Chain links -->
    <circle cx="30" cy="35" r="6" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="40" cy="45" r="6" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="50" cy="55" r="6" fill="none" stroke="#ffffff" stroke-width="2"/>
    <line x1="35" y1="38" x2="38" y2="42" stroke="#ffffff" stroke-width="2"/>
    <line x1="45" y1="48" x2="48" y2="52" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Keyhole -->
    <circle cx="40" cy="50" r="4" fill="#1e293b"/>
    <rect x="38" y="50" width="4" height="8" rx="1" fill="#1e293b"/>
  </g>
  
  <!-- Text -->
  <text x="90" y="60" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" 
        font-size="42" font-weight="800" fill="url(#textGradient)" letter-spacing="-1">
    Pass Chain
  </text>
  
  <!-- Tagline -->
  <text x="90" y="80" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" 
        font-size="12" fill="#94a3b8" letter-spacing="1">
    DECENTRALIZED PASSWORD MANAGER
  </text>
</svg>

