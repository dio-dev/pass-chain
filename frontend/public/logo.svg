<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#gradient1)" opacity="0.1"/>
  
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d946ef;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shield Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shield Base -->
  <path d="M 100 30 L 150 50 L 150 110 Q 150 140 100 165 Q 50 140 50 110 L 50 50 Z" 
        fill="url(#gradient2)" 
        stroke="#a855f7" 
        stroke-width="3"
        filter="url(#glow)"/>
  
  <!-- Chain Links -->
  <!-- Link 1 (Top) -->
  <circle cx="80" cy="75" r="12" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.9"/>
  <circle cx="80" cy="75" r="12" fill="none" stroke="#a855f7" stroke-width="2"/>
  
  <!-- Link 2 (Middle) -->
  <circle cx="100" cy="95" r="12" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.9"/>
  <circle cx="100" cy="95" r="12" fill="none" stroke="#a855f7" stroke-width="2"/>
  
  <!-- Link 3 (Bottom) -->
  <circle cx="120" cy="115" r="12" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.9"/>
  <circle cx="120" cy="115" r="12" fill="none" stroke="#a855f7" stroke-width="2"/>
  
  <!-- Connecting Lines -->
  <line x1="88" y1="82" x2="94" y2="90" stroke="#ffffff" stroke-width="4" opacity="0.7"/>
  <line x1="106" y1="102" x2="112" y2="110" stroke="#ffffff" stroke-width="4" opacity="0.7"/>
  
  <!-- Keyhole in center -->
  <circle cx="100" cy="115" r="8" fill="#1e293b"/>
  <rect x="96" y="115" width="8" height="15" rx="2" fill="#1e293b"/>
  
  <!-- Lock Body -->
  <rect x="85" y="110" width="30" height="30" rx="4" fill="#1e293b" opacity="0.3"/>
  
  <!-- Shine Effect -->
  <path d="M 70 60 Q 75 65 70 70" stroke="#ffffff" stroke-width="2" opacity="0.5" fill="none"/>
  
  <!-- Sparkle Points -->
  <circle cx="130" cy="60" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="140" cy="70" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="125" cy="80" r="1.5" fill="#ffffff" opacity="0.8"/>
</svg>

