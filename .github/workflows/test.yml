name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: passchain_test
          POSTGRES_USER: passchain
          POSTGRES_PASSWORD: passchain123
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      vault:
        image: hashicorp/vault:latest
        env:
          VAULT_DEV_ROOT_TOKEN_ID: test-token
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 8201:8200
        options: >-
          --cap-add=IPC_LOCK

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache-dependency-path: backend/go.sum

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies
      working-directory: backend
      run: |
        go mod download
        go mod verify

    - name: Wait for services
      run: |
        echo "Waiting for PostgreSQL..."
        timeout 30 bash -c 'until pg_isready -h localhost -p 5433 -U passchain; do sleep 1; done'
        echo "Waiting for Redis..."
        timeout 30 bash -c 'until redis-cli -h localhost -p 6380 ping; do sleep 1; done'
        echo "✅ All services ready"

    - name: Run go vet
      working-directory: backend
      run: go vet ./...

    - name: Run go fmt check
      working-directory: backend
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          echo "Go code is not formatted. Please run 'go fmt ./...'"
          gofmt -d .
          exit 1
        fi

    - name: Run Unit Tests
      working-directory: backend
      env:
        DATABASE_HOST: localhost
        DATABASE_PORT: 5433
        DATABASE_USER: passchain
        DATABASE_PASSWORD: passchain123
        DATABASE_NAME: passchain_test
        DATABASE_SSLMODE: disable
        VAULT_ADDR: http://localhost:8201
        VAULT_TOKEN: test-token
        REDIS_ADDR: localhost:6380
      run: |
        echo "🔬 Running unit tests..."
        go test ./internal/api/handlers -v -short -race -coverprofile=coverage_unit.out

    - name: Run Integration Tests
      working-directory: backend
      env:
        DATABASE_HOST: localhost
        DATABASE_PORT: 5433
        DATABASE_USER: passchain
        DATABASE_PASSWORD: passchain123
        DATABASE_NAME: passchain_test
        DATABASE_SSLMODE: disable
        VAULT_ADDR: http://localhost:8201
        VAULT_TOKEN: test-token
        REDIS_ADDR: localhost:6380
      run: |
        echo "🔗 Running integration tests..."
        go test ./test -v -run TestIntegration -race -coverprofile=coverage_integration.out

    - name: Run E2E Tests
      working-directory: backend
      env:
        DATABASE_HOST: localhost
        DATABASE_PORT: 5433
        DATABASE_USER: passchain
        DATABASE_PASSWORD: passchain123
        DATABASE_NAME: passchain_test
        DATABASE_SSLMODE: disable
        VAULT_ADDR: http://localhost:8201
        VAULT_TOKEN: test-token
        REDIS_ADDR: localhost:6380
      run: |
        echo "🎬 Running E2E tests..."
        go test ./test -v -run TestEndToEndFlow -race -coverprofile=coverage_e2e.out

    - name: Generate coverage report
      working-directory: backend
      run: |
        echo "📊 Generating coverage report..."
        go test ./... -coverprofile=coverage.out -covermode=atomic
        go tool cover -func=coverage.out -o=coverage.txt
        
        echo "### Test Coverage" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        go tool cover -func=coverage.out | tail -n 1 >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./backend/coverage.out
        flags: unittests
        name: codecov-pass-chain
        fail_ci_if_error: false

    - name: Upload coverage artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          backend/coverage.out
          backend/coverage.txt

    - name: Comment PR with coverage
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const coverage = fs.readFileSync('backend/coverage.txt', 'utf8');
          const comment = `## 📊 Test Coverage Report\n\n\`\`\`\n${coverage}\n\`\`\``;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v4
      with:
        version: latest
        working-directory: backend
        args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Build backend
      working-directory: backend
      run: |
        echo "🏗️  Building backend..."
        CGO_ENABLED=0 GOOS=linux go build -a -installsuffix cgo -o bin/server cmd/server/main.go
        echo "✅ Build successful"

    - name: Build Docker image
      run: |
        echo "🐳 Building Docker image..."
        docker build -t passchain/backend:${{ github.sha }} -f backend/Dockerfile backend
        echo "✅ Docker build successful"

    - name: Run Trivy security scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: passchain/backend:${{ github.sha }}
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

